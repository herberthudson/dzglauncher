name: Release Linux

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version without v prefix (e.g. 1.2.3)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE}" = tag ]; then
            V="${GITHUB_REF_NAME}"
          else
            V="${{ github.event.inputs.version }}"
          fi
          V="${V#v}"
          if [ -z "${V}" ]; then
            echo "Empty version" >&2
            exit 1
          fi
          echo "version=${V}" >> "${GITHUB_OUTPUT}"

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install system dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config \
            dpkg-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libgirepository1.0-dev \
            librsvg2-dev

      - name: Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0

      - name: wails build
        run: |
          set -euo pipefail
          echo "$(go env GOPATH)/bin" >> "${GITHUB_PATH}"
          wails build

      - name: Build distribution archives (zip and tar.gz)
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p staging/share/applications staging/share/icons/hicolor/256x256/apps dist
          cp build/bin/dzglauncher staging/dzglauncher
          cp LICENSE README.md staging/
          cp packaging/linux/dzglauncher.desktop staging/share/applications/
          cp packaging/linux/icons/hicolor/256x256/apps/dzglauncher.png staging/share/icons/hicolor/256x256/apps/
          strip staging/dzglauncher 2>/dev/null || true
          ( cd staging && zip -r9 "../dist/dzglauncher-${VERSION}-linux-amd64.zip" dzglauncher LICENSE README.md share )
          tar -C staging -czvf "dist/dzglauncher-${VERSION}-linux-amd64.tar.gz" dzglauncher LICENSE README.md share

      - name: Build .deb package
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          ROOT="deb-pkg"
          rm -rf "${ROOT}"
          mkdir -p "${ROOT}/DEBIAN" "${ROOT}/usr/bin" \
            "${ROOT}/usr/share/applications" \
            "${ROOT}/usr/share/icons/hicolor/256x256/apps"
          cp build/bin/dzglauncher "${ROOT}/usr/bin/dzglauncher"
          chmod 0755 "${ROOT}/usr/bin/dzglauncher"
          strip "${ROOT}/usr/bin/dzglauncher" 2>/dev/null || true
          cp packaging/linux/dzglauncher.desktop "${ROOT}/usr/share/applications/"
          cp packaging/linux/icons/hicolor/256x256/apps/dzglauncher.png \
            "${ROOT}/usr/share/icons/hicolor/256x256/apps/"
          SIZE="$(du -sk "${ROOT}/usr" | cut -f1)"
          SHLIB_DEPS="$(dpkg-shlibdeps -O "${ROOT}/usr/bin/dzglauncher" 2>/dev/null | sed -n 's/^shlibs:Depends=//p' || true)"
          if [ -z "${SHLIB_DEPS}" ]; then
            SHLIB_DEPS="libgtk-3-0 (>= 3.22), libwebkit2gtk-4.1-0, librsvg2-2"
          fi
          cat > "${ROOT}/DEBIAN/control" <<EOF
          Package: dzglauncher
          Version: ${VERSION}
          Architecture: amd64
          Maintainer: Herbert Hudson
          Installed-Size: ${SIZE}
          Depends: ${SHLIB_DEPS}
          Section: games
          Priority: optional
          Homepage: https://github.com/${GITHUB_REPOSITORY}
          Description: DayZ server browser and launcher
           Browse DayZ servers, favorites, Workshop mods, and launch via Steam.
          EOF
          cat > "${ROOT}/DEBIAN/postinst" <<'EOS'
          #!/bin/sh
          set -e
          if command -v update-desktop-database >/dev/null 2>&1; then
            update-desktop-database -q /usr/share/applications 2>/dev/null || true
          fi
          if command -v gtk-update-icon-cache >/dev/null 2>&1; then
            gtk-update-icon-cache -q -t -f /usr/share/icons/hicolor 2>/dev/null || true
          fi
          exit 0
          EOS
          chmod 0755 "${ROOT}/DEBIAN/postinst"
          mkdir -p dist
          dpkg-deb --root-owner-group --build "${ROOT}" "dist/dzglauncher_${VERSION}_amd64.deb"

      - name: SHA256SUMS
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          cd dist
          sha256sum \
            "dzglauncher-${VERSION}-linux-amd64.zip" \
            "dzglauncher-${VERSION}-linux-amd64.tar.gz" \
            "dzglauncher_${VERSION}_amd64.deb" \
            > SHA256SUMS
          sha256sum -c SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: dzglauncher-linux-${{ steps.ver.outputs.version }}
          path: dist/*

      - name: GitHub Release
        if: github.ref_type == 'tag' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/SHA256SUMS
            dist/dzglauncher-${{ steps.ver.outputs.version }}-linux-amd64.zip
            dist/dzglauncher-${{ steps.ver.outputs.version }}-linux-amd64.tar.gz
            dist/dzglauncher_${{ steps.ver.outputs.version }}_amd64.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync PKGBUILD version and checksum
        if: github.ref_type == 'tag' && startsWith(github.ref, 'refs/tags/v')
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TGZ="dist/dzglauncher-${VERSION}-linux-amd64.tar.gz"
          SUM="$(sha256sum "${TGZ}" | awk '{print $1}')"
          git fetch origin "${DEFAULT_BRANCH}"
          git checkout "${DEFAULT_BRANCH}"
          sed -i "s/^pkgver=.*/pkgver=${VERSION}/" packaging/aur/PKGBUILD
          sed -i "s/^sha256sums=(.*/sha256sums=('${SUM}')/" packaging/aur/PKGBUILD
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packaging/aur/PKGBUILD
          if git diff --staged --quiet; then
            exit 0
          fi
          git commit -m "chore(packaging): sync PKGBUILD for v${VERSION}"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${DEFAULT_BRANCH}"
